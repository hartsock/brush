# This is the hartsock/brush fork release configuration. See FORK_RELEASE.md.
# Package renaming must be complete before invoking release-plz. Unlisted
# packages, including every upstream-named application crate, stay disabled.
[workspace]
repo_url = "https://github.com/hartsock/brush"
release = false
publish = false
git_tag_enable = false
git_release_enable = false
changelog_update = false
publish_allow_dirty = false
publish_no_verify = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
git_release_type = "auto"
git_release_latest = false
# Preserve the maintainer's review of GitHub release notes. Registry uploads
# are already public when release-plz creates these draft GitHub releases.
git_release_draft = true
git_release_body = """
Fork package {{ package }} {{ version }} from hartsock/brush.

See FORK_RELEASE.md at the tagged commit for the package set, validation, and
the separate Newt integration and upstream contribution steps.

{{ changelog }}
"""

[[package]]
name = "brush-ocap-parser"
release = true
publish = true
git_tag_enable = true
git_release_enable = true

[[package]]
name = "brush-ocap-core"
release = true
publish = true
git_tag_enable = true
git_release_enable = true

[[package]]
name = "brush-ocap-builtins"
release = true
publish = true
git_tag_enable = true
git_release_enable = true

[[package]]
name = "brush-ocap-coreutils-builtins"
release = true
publish = true
git_tag_enable = true
git_release_enable = true
